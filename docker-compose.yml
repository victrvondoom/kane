# Long-lived single-container deployment. Database and evidence live on the named volume.
services:
  shipproof:
    build: .
    restart: unless-stopped
    ports: ["4000:4000"]
    environment:
      PORT: "4000"
      DATA_DIR: /data
      COOKIE_SECURE: "1"          # serve behind HTTPS
      TRUST_PROXY: "1"            # one reverse proxy in front (Caddy, nginx, a platform router)
      ALLOW_PRIVATE_TARGETS: "0"  # refuse loopback/private application URLs
      REQUIRE_EVIDENCE: "1"
      LT_USERNAME: ${LT_USERNAME:?set LT_USERNAME in your shell or .env}
      LT_ACCESS_KEY: ${LT_ACCESS_KEY:?set LT_ACCESS_KEY in your shell or .env}
    volumes: ["shipproof-data:/data"]
    stop_grace_period: 20s        # lets the server stop the browser and record interrupted checks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  shipproof-data:
